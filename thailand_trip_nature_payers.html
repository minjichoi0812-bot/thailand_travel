.summaries.single-total{display:block;padding:20px 25px;background:linear-gradient(105deg,#e9edd7,#f8f3e5);border:1px solid #e3e7d0}.single-total .summary{padding:0;border:0}.single-total .summary-label{font-size:12px;color:#6d795b}.single-total .summary strong{font-size:34px;color:#36582f;margin-top:4px}.single-total .summary:after{display:none}.mini-toolbar{margin-top:16px}.expense-row .plan-col,.group-table .plan-col{display:none!important}@media(max-width:500px){.single-total .summary strong{font-size:30px}}


/* Refinements: matching sans-serif title, unmistakable destination bands, larger day plan. */
.masthead h1{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:750;letter-spacing:-.055em}
.date-cell{--band:#dfebfa;--city:#416eac;min-height:102px}
.date-cell.hh{--band:#e0f1e6;--city:#308269}
.date-cell[aria-pressed=true] .date-number{background:var(--city);box-shadow:0 5px 12px #274b5720;color:#fff}
.date-cell .date-sub{color:var(--city);font-size:10px;font-weight:560;line-height:1.35}
.date-cell:disabled .date-sub{color:#aaa}
.legend i{background:#6388bb}
.legend i.hh{background:#4b9a78}
.calendar{row-gap:13px}
.date-number{width:44px;height:44px;font-size:18px}
.calendar-card{padding:27px 26px 22px}
.weekdays{font-size:13px}
.day-card{padding:28px 30px 25px;margin-top:20px}
.day-header{margin-bottom:21px}
.day-header h3{font-size:27px}
.day-badge{background:#e5eef9;color:#416eac;font-weight:650}
.day-card.hh .day-badge{background:#e0f1e6;color:#308269}
.stay-link{padding:13px 15px;margin-bottom:22px}
.stay-copy b{font-size:13px}
.event{margin-bottom:14px}
.event-block{padding:14px 16px;min-height:53px;background:linear-gradient(90deg,#e5eef9,#f4f6ee)}
.day-card.hh .event-block{background:linear-gradient(90deg,#e2f1e8,#f4f7ec)}
.event-block b{font-size:14px;font-weight:600;line-height:1.5}
.event-block p{font-size:12px}
.event-time{font-size:12px;padding-top:15px}
.event-block:before{background:#6285b5;top:21px}
.day-card.hh .event-block:before{background:#479372}
.event-input{font-size:14px;height:30px}
.note-input{font-size:12px}
.person-switch{background:#eae8d8;gap:4px;padding:4px;white-space:nowrap}
.person-switch button{min-width:74px;font-weight:650}
.person-switch button[aria-pressed=true]{background:#587744;color:white;box-shadow:0 2px 7px #30503120}
.single-total .summary strong{font-size:36px}
.budget-explainer{font-size:11px;color:#839273;margin-top:5px;letter-spacing:-.01em}
@media(max-width:500px){
 .masthead h1{font-size:23px;font-weight:760}
 .calendar-card{padding:23px 12px 19px}
 .date-cell{min-height:82px;padding-top:5px;gap:4px}
 .date-number{width:36px;height:36px;font-size:15px}
 .date-cell.travel:before{height:34px;top:7px}
 .date-cell .date-sub{font-size:8.5px;white-space:normal;max-height:27px;min-height:13px;line-height:1.22;overflow:hidden}
 .calendar{row-gap:9px}
 .day-card{padding:24px 19px 23px;margin-top:17px}
 .day-header h3{font-size:24px}
 .stay-link{padding:11px 12px;margin-bottom:18px}
 .stay-copy b{font-size:12px}
 .event{margin-bottom:12px}
 .event-block{min-height:49px;padding:12px 13px}
 .event-block b{font-size:12px}
 .event-block p{font-size:10.5px}
 .event-time{padding-top:12px;font-size:10px}
 .event-block:before{top:18px}
 .event-input{font-size:12px;height:26px}
 .person-switch button{min-width:58px;padding:7px 12px;font-size:11px}
 .single-total .summary strong{font-size:32px}
 .budget-explainer{font-size:10px;line-height:1.45}
}
@media(max-width:360px){.masthead h1{font-size:21px}.person-switch button{min-width:52px;padding:6px 8px}}

/* Per-item ownership: one amount, one responsibility choice. */
.schedule-legend{justify-content:flex-end;align-items:center;width:100%;gap:25px;margin:12px 0 0;padding:0 2px}
#schedule .schedule-legend+ .day-card{margin-top:16px}
.shared-hint{font-size:11px;color:#969179}
.payer-summary{display:grid!important;grid-template-columns:1.1fr 1fr;align-items:center;gap:30px}
.payer-summary .summary{border-right:0}
.payer-totals{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.person-amount{min-width:0;display:flex;flex-direction:column;gap:7px;padding-left:18px;border-left:1px solid #d8dfc5}
.person-amount span{font-size:12px;font-weight:600;color:#7c806b}
.person-amount strong{font-size:20px;color:#4a613e;line-height:1.35;letter-spacing:-.045em;white-space:nowrap}
.person-amount.ju span:before,.person-amount.ming span:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;background:#668bb2;vertical-align:middle}
.person-amount.ming span:before{background:#a78260}
.ledger col.name{width:29%}.ledger col.qty{width:8%}.ledger col.daily{width:19%}.ledger col.amount{width:23%}.ledger col.payer-col{width:15%}.ledger col.action{width:6%}
.payer-head{text-align:center}
.expense-row .payer-cell{padding:3px 6px;text-align:center}
.payer-control{display:inline-flex;position:relative;width:100%;max-width:90px;min-height:32px;border-radius:9px;background:#eeeee1;color:#727a57;box-shadow:inset 0 0 0 1px #dedfcb55;vertical-align:middle}
.payer-control[data-payer-style=ju]{background:#e9f0f5;color:#4b7297;box-shadow:inset 0 0 0 1px #bfd2e155}
.payer-control[data-payer-style=ming]{background:#f5ebe0;color:#966d48;box-shadow:inset 0 0 0 1px #e7c9a755}
.payer-select{appearance:none;-webkit-appearance:none;display:block;cursor:pointer;border-radius:9px;width:100%;height:32px;padding:5px 23px 5px 10px;font-size:12px;font-weight:600;color:inherit;background:transparent;text-align:left;line-height:1.5}
.payer-control svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none}

}

const STAYS=[{id:'bangkok',city:'bangkok',from:'2027-02-02',to:'2027-02-07',nights:5},{id:'vala',city:'huahin',from:'2027-02-07',to:'2027-02-09',nights:2},{id:'puta',city:'huahin',from:'2027-02-09',to:'2027-02-11',nights:2},{id:'airport',city:'airport',from:'2027-02-11',to:'2027-02-12',nights:1}],short=d=>`${+d.slice(5,7)}/${+d.slice(8,10)}`;
function pinned(d){const hotel=id=>byId(id)?.name||'호텔 미정';const a={'2027-02-02':[{time:clock(FLIGHTS[0].dep),title:'인천 → 수완나품 · TG657',note:`도착 ${clock(FLIGHTS[0].arr)} · ${zone()}`}],'2027-02-07':[{title:'방콕 → 후아힌 이동',time:'',note:''}],'2027-02-09':[{title:'리조트 이동',time:'',note:`${hotel('vala')} → ${hotel('puta')}`}],'2027-02-10':[{title:'엄마 생일 🎂🎉',time:'',note:''}],'2027-02-11':[{title:'후아힌 → 방콕(공항) 이동',time:'',note:''}],'2027-02-12':[{title:'수완나품 → 인천 · TG652',time:clock(FLIGHTS[1].dep),note:`도착 ${clock(FLIGHTS[1].arr)} · ${zone()}`}]};return a[d]||[]}
function renderCalendar(){const labels={2:'출발',7:'후아힌 이동',9:'리조트 이동',10:'엄마 생일 🎉',11:'방콕 이동',12:'도착'};$('#calendar').innerHTML=Array.from({length:14},(_,i)=>{const n=i+1,d=dayDate(n),travel=n>=2&&n<=12,city=cityOf(d),start=n===2||n===8||city!==cityOf(dayDate(n-1)),end=n===12||n===7||city!==cityOf(dayDate(n+1)),events=state.events.filter(e=>e.date===d);return `<button class="date-cell ${travel?'travel':''} ${city==='huahin'?'hh':''} ${start?'start':''} ${end?'end':''}" data-date="${d}" aria-pressed="${d===state.selected}" aria-label="2월 ${n}일" ${travel?'':'disabled'}><span class="date-number num">${n}</span>${travel?`<span class="date-city">${CITIES[city]}</span><span class="date-sub">${esc(labels[n]||events[0]?.title||'')}</span>`:''}</button>`}).join('')}
function renderStay(){const slot=STAYS.find(s=>state.selected>=s.from&&state.selected<s.to),r=slot&&byId(slot.id);$('#dayStay').hidden=!slot;if(!slot){$('#dayStay').innerHTML='';return}$('#dayStay').innerHTML=`<h4 class="stay-label">숙소</h4><button class="stay-link" data-stay="${slot.id}"><span class="stay-icon">${icon('hotel')}</span><span class="stay-copy"><b>${esc(r?.name?.trim()||'호텔 미정')}</b><small>${CITIES[slot.city]} · ${short(slot.from)}–${short(slot.to)} · ${slot.nights}박${state.selected===slot.from?' · 체크인':''}</small></span>${icon('arrow',15)}</button>`}
function renderEvents(){const d=state.selected,n=+d.slice(-2),w=WEEK[new Date(d+'T12:00:00Z').getUTCDay()];$('#dayTitle').textContent=`2/${n}(${w})`;$('#dayBadge').textContent=`DAY ${n-1} · ${n===12?'귀국':CITIES[cityOf(d)]}`;$('#dayCard').classList.toggle('hh',cityOf(d)==='huahin');renderStay();const list=[...pinned(d),...state.events.filter(e=>e.date===d)].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));$('#events').innerHTML=list.length?list.map(e=>e.id?`<div class="event event-user"><input class="time-input" type="time" data-event="time" data-id="${esc(e.id)}" value="${esc(e.time)}" aria-label="일정 시간"><div class="event-block"><input class="event-input" data-event="title" data-id="${esc(e.id)}" value="${esc(e.title)}" placeholder="일정 이름" maxlength="150" aria-label="일정 이름"><textarea class="note-input" data-event="note" data-id="${esc(e.id)}" placeholder="장소 · 메모" maxlength="500" aria-label="일정 메모">${esc(e.note)}</textarea><button class="icon-btn event-del" data-delete="event" data-id="${esc(e.id)}" aria-label="일정 삭제">${icon('trash',15)}</button></div></div>`:`<div class="event"><span class="event-time num">${e.time||'종일'}</span><div class="event-block"><b>${esc(e.title)}</b>${e.note?`<p>${esc(e.note)}</p>`:''}</div></div>`).join(''):'<p class="empty">아직 정한 일정이 없어요</p>'}
function selectDate(d){if(!/^2027-02-(0[2-9]|1[0-2])$/.test(d))return;state.selected=d;renderCalendar();renderEvents();save()}
function setTab(t){tab=['schedule','budget','packing'].includes(t)?t:'schedule';$$('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',b.dataset.tab===tab);b.tabIndex=b.dataset.tab===tab?0:-1});$$('.view').forEach(s=>s.hidden=s.id!==tab);if(tab==='schedule')renderEvents();try{history.replaceState(null,'','#'+tab)}catch(e){}}
function quantity(r,cls='quantity'){return `<div class="${cls}"><input class="qty-input" data-field="qty" data-id="${r.id}" type="number" min="1" max="365" value="${r.qty}" aria-label="${esc(r.name)} 수량"><select class="unit-select" data-field="unit" data-id="${r.id}" aria-label="${esc(r.name)} 단위">${Object.entries(UNIT).map(([key,label])=>`<option value="${key}" ${r.unit===key?'selected':''}>${label}</option>`).join('')}</select></div>`}
function field(r,key){
 const n=r.total,v=n===null?'':fmt(n/(key==='daily'?r.qty:1));
 return `<input class="money ${key}" data-field="${key}" data-id="${r.id}" inputmode="decimal" value="${v}" placeholder="\u2014" aria-label="${esc(r.name)} ${key==='daily'?'1'+UNIT[r.unit]+' \ub2e8\uac00':'\ud56d\ubaa9 \ucd1d\uc561'}" autocomplete="off">`;
}
function payerControl(r){
 return `<span class="payer-control" data-payer-style="${r.payer}"><select class="payer-select" data-field="payer" data-id="${r.id}" aria-label="${esc(r.name)||'\uc0c8 \ud56d\ubaa9'} \ubd80\ub2f4\uc790">${Object.entries(PAYERS).map(([key,label])=>`<option value="${key}" ${r.payer===key?'selected':''}>${label}</option>`).join('')}</select><svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></span>`;
}
function expenseRow(r){
 return `<tr class="expense-row" data-row="${r.id}" data-category="${r.category}" ${state.expanded[r.category]?'':'hidden'}>
 <td><input class="row-name" data-field="name" data-id="${r.id}" value="${esc(r.name)}" placeholder="\ud56d\ubaa9\uba85" maxlength="100" aria-label="\ud56d\ubaa9\uba85">${quantity(r,'quantity mobile-quantity')}</td>
 <td class="qty-col">${quantity(r)}</td><td>${field(r,'daily')}<div class="unit-caption">/ 1${UNIT[r.unit]}</div></td><td>${field(r,'amount')}</td>
 <td class="payer-cell">${payerControl(r)}</td>
 <td class="action-cell"><button class="icon-btn delete-btn" data-delete="expense" data-id="${r.id}" aria-label="${esc(r.name)} \uc0ad\uc81c">${icon('trash',16)}</button></td></tr>`;
}
function renderTable(){
 let html='';
 for(const [c,label] of Object.entries(CATS)){
  const rows=state.rows.filter(r=>r.category===c),open=!!state.expanded[c];
  html+=`<article class="card expense-group"><button class="group-toggle" data-category-toggle="${c}" aria-expanded="${open}" aria-controls="group-${c}"><span class="category-icon">${icon(c)}</span><b>${label}</b><strong class="group-total num" data-subtotal="${c}"></strong><span class="chevron">${icon('down',17)}</span></button><div class="group-table" id="group-${c}" ${open?'':'hidden'}><div class="ledger-scroll"><table aria-label="${label} \uacbd\ube44"><colgroup><col class="name"><col class="qty"><col class="daily"><col class="amount"><col class="payer-col"><col class="action"></colgroup><thead><tr><th>\ud56d\ubaa9</th><th class="qty-col">\uc218\ub7c9</th><th>\ub2e8\uac00</th><th>\ucd1d\uc561</th><th class="payer-head">\ubd80\ub2f4</th><th aria-label="\uc0ad\uc81c"></th></tr></thead><tbody>`;
  if(c==='hotel'){
   for(const [city,name] of Object.entries(CITIES)){
    html+=`<tr class="region"><td colspan="6"><div class="region-inner"><span>${name}</span><button class="small-plus" data-add="hotel" data-city="${city}" aria-label="${name} \uc219\uc18c \ucd94\uac00">+</button></div></td></tr>`;
    html+=rows.filter(r=>r.city===city).map(expenseRow).join('');
   }
   html+=rows.filter(r=>!Object.hasOwn(CITIES,r.city)).map(expenseRow).join('');
  }else html+=rows.map(expenseRow).join('');
  html+=`<tr class="add-row"><td colspan="6"><button class="add-inline" data-add="${c}" aria-label="${label} \ud56d\ubaa9 \ucd94\uac00">+</button></td></tr></tbody></table></div></div></article>`;
 }
 $('#expenses').innerHTML=html;renderSummary();
}
function fixSpans(){const n=6-(innerWidth<=500?1:0);$$('.region td,.add-row td').forEach(e=>e.colSpan=n)}
function renderSummary(){
 let total=0,ju=0,ming=0;
 for(const r of state.rows){const a=allocation(r);total+=value(r);ju+=a.ju;ming+=a.ming}
 $('#totalLabel').textContent='\uc804\uccb4 \uc5ec\ud589 \uacbd\ube44';
 $('#total').textContent=fmt(total)+'\uc6d0';
 $('#juTotal').textContent=fmt(ju)+'\uc6d0';
 $('#mingTotal').textContent=fmt(ming)+'\uc6d0';
 $('#tableLabel').textContent='\uc804\uccb4 \ud569\uacc4';
 $('#tableTotal').textContent=fmt(total)+'\uc6d0';
 $$('[data-subtotal]').forEach(e=>e.textContent=fmt(state.rows.filter(r=>r.category===e.dataset.subtotal).reduce((sum,r)=>sum+value(r),0))+'\uc6d0');
 fixSpans();
}
function refreshRow(r){
 $$(`[data-row="${r.id}"] [data-field]`).forEach(e=>{
  if(e===document.activeElement)return;
  const key=e.dataset.field;
  if(['daily','amount'].includes(key))e.value=r.total===null?'':fmt(value(r)/(key==='daily'?r.qty:1));
  else e.value=r[key];
 });
 const control=$(`[data-row="${r.id}"] .payer-control`);if(control)control.dataset.payerStyle=r.payer;
 renderSummary();
}
function updateExpense(e){
 const r=byId(e.dataset.id),key=e.dataset.field;if(!r)return;
 if(key==='name'){r.name=e.value.slice(0,100);renderStay()}
 else if(key==='payer'){
  if(!Object.hasOwn(PAYERS,e.value))return;
  r.payer=e.value;
 }
 else if(key==='qty'){
  const n=Number(e.value);
  if(!Number.isInteger(n)||n<1||n>365){e.setAttribute('aria-invalid','true');return}
  if(r.basis==='daily'&&r.total!==null){
   const next=Math.round(r.total*n/r.qty);
   if(!Number.isFinite(next)||next>MAX){e.setAttribute('aria-invalid','true');return}
   r.total=next;
  }
  r.qty=n;
 }
 else if(key==='unit'){
  if(!Object.hasOwn(UNIT,e.value))return;
  r.unit=e.value;renderTable();
 }
 else if(key==='amount'||key==='daily'){
  const n=parse(e.value),scaled=n===null?null:n*(key==='daily'?r.qty:1);
  if(Number.isNaN(n)||(scaled!==null&&(!Number.isFinite(scaled)||scaled>MAX))){e.setAttribute('aria-invalid','true');return}
  r.total=scaled===null?null:Math.round(scaled);r.basis=key==='daily'?'daily':'total';
 }else return;
 e.removeAttribute('aria-invalid');refreshRow(r);save();
}

function addExpense(category,city='common'){
 const unit=category==='hotel'?'night':category==='food'?'day':'time';
 const r=row(uid(),category,'',unit==='day'?11:1,unit,null,null,category==='hotel'?(CITIES[city]?city:'bangkok'):'common');
 state.rows.push(r);state.expanded[category]=true;renderTable();save();$(`[data-row="${r.id}"] .row-name`).focus();
}

function renderPacking(){const done=state.packing.filter(p=>p.done).length,n=state.packing.length,pct=n?Math.round(done/n*100):0;$('#packCount').textContent=`${done} / ${n}개 · ${pct}%`;$('#progressBar').style.width=pct+'%';$('#progress').setAttribute('aria-valuemin','0');$('#progress').setAttribute('aria-valuemax',String(n));$('#progress').setAttribute('aria-valuenow',String(done));$('#packGroups').innerHTML=Object.entries(PACK).map(([c,label])=>{const rows=state.packing.filter(p=>p.category===c),open=!!state.packOpen[c];return `<div class="card pack-group"><button class="group-toggle" data-pack-toggle="${c}" aria-expanded="${open}"><span class="category-icon">${icon(({essential:'packing',clothes:'shirt',toiletries:'bottle',devices:'phone',other:'misc'})[c])}</span><b>${label}</b><span class="group-total">${rows.filter(p=>p.done).length} / ${rows.length}</span><span class="chevron">${icon('down',16)}</span></button><div class="pack-items" ${open?'':'hidden'}>${rows.map(p=>`<div class="pack-item ${p.done?'done':''}"><input class="check" type="checkbox" data-check="${p.id}" ${p.done?'checked':''} aria-label="${esc(p.name)} 준비 완료"><input class="pack-name" data-pack-name="${p.id}" value="${esc(p.name)}" maxlength="100" placeholder="준비물" aria-label="준비물 이름"><button class="icon-btn" data-delete="packing" data-id="${p.id}" aria-label="${esc(p.name)} 삭제">${icon('trash',15)}</button></div>`).join('')}<button class="add-inline" data-add-pack="${c}" aria-label="${label} 준비물 추가">+</button></div></div>`}).join('')}
function requestDelete(kind,id,trigger){const arr=kind==='expense'?state.rows:kind==='event'?state.events:state.packing,entry=arr.find(e=>e.id===id);if(!entry)return;pending={kind,id};returnFocus=trigger;$('#dialogText').textContent=`“${entry.name||entry.title||'새 항목'}”을 삭제합니다. 삭제 후 되돌릴 수 있어요.`;$('#dialog').hidden=false;document.body.style.overflow='hidden';$('#cancel').focus()}
function closeDialog(){pending=null;$('#dialog').hidden=true;document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus()}
function rerender(){renderFlights();renderCalendar();renderEvents();renderTable();renderPacking()}
function confirmDelete(){if(!pending)return;const {kind,id}=pending,key=kind==='expense'?'rows':kind==='event'?'events':'packing',index=state[key].findIndex(e=>e.id===id);if(index<0)return closeDialog();undo={key,index,item:clone(state[key][index])};state[key].splice(index,1);closeDialog();rerender();save();toast('항목을 삭제했어요.',true)}
$('#app').addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.tab)setTab(b.dataset.tab);else if(b.dataset.zone){state.zone=b.dataset.zone;renderFlights();renderEvents();save()}else if(b.dataset.date&&!b.disabled)selectDate(b.dataset.date);else if(b.dataset.categoryToggle){const c=b.dataset.categoryToggle;state.expanded[c]=!state.expanded[c];renderTable();save()}else if(b.dataset.add)addExpense(b.dataset.add,b.dataset.city);else if(b.dataset.delete)requestDelete(b.dataset.delete,b.dataset.id,b);else if(b.dataset.packToggle){state.packOpen[b.dataset.packToggle]=!state.packOpen[b.dataset.packToggle];renderPacking();save()}else if(b.dataset.addPack){const p={id:uid(),category:b.dataset.addPack,name:'',done:false};state.packing.push(p);renderPacking();save();$(`[data-pack-name="${p.id}"]`).focus()}else if(b.dataset.stay){let r=byId(b.dataset.stay);if(!r){const base=BASE.rows.find(x=>x.id===b.dataset.stay);r={...clone(base),name:'',total:null};state.rows.push(r)}state.expanded.hotel=true;renderTable();setTab('budget');save();const input=$(`[data-row="${r.id}"] .row-name`);input.scrollIntoView({block:'center',behavior:'smooth'});input.focus()}});
$('#addEvent').onclick=()=>{const e={id:uid(),date:state.selected,time:'',title:'',note:''};state.events.push(e);renderEvents();save();$(`[data-event="title"][data-id="${e.id}"]`).focus()};
$('#expenses').addEventListener('input',ev=>{if(ev.target.matches('input[data-field]'))updateExpense(ev.target)});$('#expenses').addEventListener('change',ev=>{if(ev.target.matches('select[data-field]'))updateExpense(ev.target)});$('#expenses').addEventListener('focusin',ev=>{const e=ev.target;if(!e.matches('.money'))return;const r=byId(e.dataset.id),n=r.total;e.value=n===null?'':Number(n/(e.dataset.field==='daily'?r.qty:1)).toLocaleString('en-US',{maximumFractionDigits:6});e.select()});$('#expenses').addEventListener('focusout',ev=>{const e=ev.target,r=byId(e.dataset.id);if(!r)return;if(e.hasAttribute('aria-invalid')){toast('금액과 수량을 확인해 주세요.');e.removeAttribute('aria-invalid')}if(e.matches('.money')){const n=r.total;e.value=n===null?'':fmt(n/(e.dataset.field==='daily'?r.qty:1))}else if(e.dataset.field==='qty')e.value=r.qty});$('#expenses').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('input')){ev.preventDefault();ev.target.blur()}});
$('#events').addEventListener('input',ev=>{const e=ev.target,r=state.events.find(x=>x.id===e.dataset.id);if(!r||!e.dataset.event)return;r[e.dataset.event]=e.value;save();renderCalendar()});$('#packGroups').addEventListener('input',ev=>{const e=ev.target,p=state.packing.find(x=>x.id===e.dataset.packName);if(p){p.name=e.value.slice(0,100);save()}});$('#packGroups').addEventListener('change',ev=>{const p=state.packing.find(x=>x.id===ev.target.dataset.check);if(p){p.done=ev.target.checked;renderPacking();save()}});
$('#cancel').onclick=closeDialog;$('#confirm').onclick=confirmDelete;$('#dialog').addEventListener('click',ev=>{if(ev.target===$('#dialog'))closeDialog()});$('#dialog').addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.preventDefault();closeDialog()}if(ev.key==='Tab'){const a=$('#cancel'),b=$('#confirm');if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();b.focus()}else if(!ev.shiftKey&&document.activeElement===b){ev.preventDefault();a.focus()}}});$('#undo').onclick=()=>{if(!undo)return;state[undo.key].splice(Math.min(undo.index,state[undo.key].length),0,undo.item);undo=null;rerender();save();toast('다시 복원했어요.')};
$('#backup').onclick=()=>{const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='thailand-trip-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#restore').onclick=()=>$('#importFile').click();$('#importFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('size');const s=normalize(JSON.parse(await f.text()));if(!s)throw Error('format');state=s;rerender();save();toast('백업을 불러왔어요.')}catch(e){toast('올바른 여행 경비 백업 파일을 선택해 주세요.')}ev.target.value=''};
$('.tabs').addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(ev.key))return;ev.preventDefault();const keys=['schedule','budget','packing'],i=keys.indexOf(tab);setTab(ev.key==='Home'?keys[0]:ev.key==='End'?keys[2]:keys[(i+(ev.key==='ArrowRight'?1:2))%3]);$(`[data-tab="${tab}"]`).focus()});$('#calendar').addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key))return;ev.preventDefault();const n=+state.selected.slice(-2)+({ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[ev.key]);selectDate(dayDate(Math.max(2,Math.min(12,n))));$(`[data-date="${state.selected}"]`).focus()});window.addEventListener('resize',fixSpans);window.addEventListener('hashchange',()=>setTab(location.hash.slice(1)));window.addEventListener('storage',ev=>{if(ev.key!==KEY||!ev.newValue)return;try{const s=normalize(JSON.parse(ev.newValue));if(s){state=s;rerender()}}catch(e){}});window.addEventListener('focus',countdown);setInterval(countdown,60000);rerender();countdown();setTab(location.hash.slice(1));$('#storageError').hidden=storageOK;
})();

</script></body></html>
